name: Publish @urantia/api

on:
  push:
    tags:
      - '@urantia/api@*'

# No job has more than read access unless it says so.
permissions:
  contents: read

jobs:
  # Everything that runs code from the repo or from a package happens here, with no right to publish.
  verify:
    runs-on: ubuntu-latest
    outputs:
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag can point at any commit. Only a commit that is on main can be released.
      - name: Verify the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main."
            exit 1
          fi

      - name: Verify package.json version matches tag
        working-directory: packages/api
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${REF_NAME#@urantia/api@}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag expects version $TAG_VERSION but package.json has $PKG_VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No install script runs. Each package is checked against the registry's signature before any
      # code of a package runs.
      - run: npm ci --ignore-scripts
      - run: npm audit signatures

      - run: npm run build --workspace @urantia/api


      # The name and the hash of the file go to the publish job, which checks both before it uploads.
      - name: Pack
        id: pack
        working-directory: packages/api
        run: |
          mkdir "$RUNNER_TEMP/out"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/out"
          FILE=$(ls "$RUNNER_TEMP/out")
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/out/$FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 1

  # This job runs no code from the repo and installs nothing. It only uploads the file that verify made.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: package

      # The file must be the one that verify made, and it must be this package at the tagged version.
      - name: Check the file
        env:
          FILE: ${{ needs.verify.outputs.file }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$(ls -A | wc -l)" != "1" ] || [ ! -f "$FILE" ]; then
            echo "::error::Expected exactly one file, named $FILE."; ls -A; exit 1
          fi
          echo "$SHA256  $FILE" | sha256sum --check --strict
          tar -xzf "$FILE" package/package.json
          NAME=$(node -p "require('./package/package.json').name")
          VERSION=$(node -p "require('./package/package.json').version")
          rm -rf package
          if [ "$NAME@$VERSION" != "$REF_NAME" ]; then
            echo "::error::The file holds $NAME@$VERSION, but the tag is $REF_NAME."; exit 1
          fi

      - name: Publish to npm with provenance
        env:
          FILE: ${{ needs.verify.outputs.file }}
        run: npm publish "./$FILE" --provenance --access public
