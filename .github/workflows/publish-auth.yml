name: Publish @urantia/auth

on:
  push:
    tags:
      - '@urantia/auth@*'

# No job has more than read access unless it says so.
permissions:
  contents: read

jobs:
  # Everything that runs code from the repo or from a package happens here, with no right to publish.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag can point at any commit. Only a commit that is on main can be released.
      - name: Verify the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main."
            exit 1
          fi

      - name: Verify package.json version matches tag
        working-directory: packages/auth
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${REF_NAME#@urantia/auth@}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag expects version $TAG_VERSION but package.json has $PKG_VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No install script runs. Each package is checked against the registry's signature before any
      # code of a package runs.
      - run: npm ci --ignore-scripts
      - run: npm audit signatures

      - run: npm run build --workspace @urantia/auth

      - run: npm test --workspace @urantia/auth

      - name: Pack
        working-directory: packages/auth
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 1

  # This job runs no code from the repo and installs nothing. It only uploads the file that verify made.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: package

      - name: Publish to npm with provenance
        run: npm publish ./*.tgz --provenance --access public
