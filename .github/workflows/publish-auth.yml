name: Publish @urantia/auth

on:
  push:
    tags:
      - '@urantia/auth@*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag can point at any commit. Only a commit that is on main can be released.
      - name: Verify the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Each installed package must carry a valid signature of the registry.
      - run: npm audit signatures

      - run: npm run build --workspace @urantia/auth
      - run: npm test --workspace @urantia/auth

      - name: Verify package.json version matches tag
        working-directory: packages/auth
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${REF_NAME#@urantia/auth@}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag expects version $TAG_VERSION but package.json has $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm with provenance
        working-directory: packages/auth
        run: npm publish --provenance --access public
